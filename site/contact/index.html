<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="联系 BANCI — 品牌、产品体验与 AI 创意设计合作。">
  <title>Contact — BANCI</title>
  <link rel="icon" href="/banci.svg">
  <link rel="stylesheet" href="/portfolio.css">
  <link rel="stylesheet" href="/contact/contact.css">
</head>
<body class="contact-page" id="top">
  <header class="site-header" data-tone="light">
    <a class="logo" href="/" aria-label="BANCI 首页"><img src="/banci.svg" alt=""><b>BANCI</b></a>
    <nav aria-label="主导航"><a href="/work/">WORK</a><a href="/about/">ABOUT</a><a href="/projects/aku.html">JOURNAL</a><a href="/contact/" aria-current="page">CONTACT</a></nav>
  </header>
  <main>
    <section class="contact-page-hero">
      <span class="eyebrow" data-zh="接受精选合作机会" data-en="AVAILABLE FOR SELECTED OPPORTUNITIES">接受精选合作机会</span>
      <h1 data-zh="一起创造<br>下一步。" data-en="LET'S MAKE<br>WHAT COMES NEXT." data-i18n-html>一起创造<br>下一步。</h1>
    </section>

    <section class="contact-available" aria-labelledby="contact-available-title">
      <p class="contact-section-label" id="contact-available-title">AVAILABLE FOR</p>
      <div class="contact-available-list" data-contact-available></div>
    </section>

    <section class="contact-primary" data-contact-primary hidden aria-labelledby="contact-primary-title">
      <p class="contact-section-label" id="contact-primary-title">CONTACT</p>
      <div class="contact-email" data-contact-field>
        <span>EMAIL ADDRESS</span>
        <a data-contact-email href=""></a>
        <i aria-hidden="true">↗</i>
      </div>
    </section>

    <section class="contact-information" aria-label="Contact information">
      <article class="contact-info-block">
        <span>01 / BASED IN</span>
        <strong data-contact-location>中国深圳</strong>
      </article>
      <article class="contact-info-block">
        <span>02 / FOCUS</span>
        <div class="contact-info-values" data-contact-focus></div>
      </article>
      <article class="contact-info-block" data-contact-profiles hidden>
        <span>03 / PROFILES</span>
        <div class="contact-profile-links">
          <a data-contact-linkedin data-contact-field href="" hidden>LINKEDIN ↗</a>
          <a data-contact-resume data-contact-field href="" hidden>RESUME ↗</a>
        </div>
      </article>
    </section>

    <section class="contact-explore" aria-labelledby="contact-explore-title">
      <h2 id="contact-explore-title">EXPLORE</h2>
      <nav aria-label="Continue exploring">
        <a href="/work/"><span>WORK INDEX</span><span aria-hidden="true">↗</span></a>
        <a href="/about/"><span>ABOUT</span><span aria-hidden="true">↗</span></a>
        <a href="/projects/aku.html"><span>AKU JOURNAL</span><span aria-hidden="true">↗</span></a>
      </nav>
    </section>
  </main>
  <footer class="site-footer--compact"><span>BANCI © 2026</span><span>SHENZHEN, CHINA</span><a href="#top">BACK TO TOP ↑</a></footer>
  <script src="/contact-system.js"></script>
</body>
</html>
