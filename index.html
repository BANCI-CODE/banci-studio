<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="icon" type="image/svg+xml" href="./BANCI.svg">


<title>BANCI — Design Thinking Studio</title>


<!-- Anton Font -->

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">



<style>


*{

margin:0;

padding:0;

box-sizing:border-box;

}



html,
body{

width:100%;

height:100%;

}



body{

background:#090909;

color:#fff;

display:flex;

justify-content:center;

align-items:center;

font-family:
"Helvetica Neue",
Arial,
sans-serif;

}



.container{

text-align:center;

animation:show 1.2s ease;

}



/* Logo */

.logo{

width:160px;

height:160px;

object-fit:contain;

margin-bottom:50px;

filter:brightness(0) invert(1);

}



/* BANCI */

h1{

font-family:"Anton", sans-serif;

font-size:96px;

font-weight:400;

letter-spacing:12px;

line-height:1;

color:#ffffff;

}



/* 描述 */

.subtitle{

margin-top:45px;

font-size:18px;

letter-spacing:6px;

color:#BEBEBE;

}



.tagline{

margin-top:24px;

font-size:16px;

letter-spacing:5px;

color:#777;

}



.status{

margin-top:65px;

font-size:12px;

letter-spacing:10px;

color:#555;

}




@keyframes show{


from{

opacity:0;

transform:translateY(30px);

}


to{

opacity:1;

transform:translateY(0);

}


}



/* 手机 */

@media(max-width:768px){


.logo{

width:100px;

height:100px;

}



h1{

font-size:55px;

letter-spacing:8px;

}



.subtitle{

font-size:13px;

}



}


</style>


</head>



<body>


<div class="container">


<img 
src="./BANCI.svg"
class="logo"
alt="BANCI Logo">



<h1>

BANCI

</h1>



<div class="subtitle">

Design Thinking Studio

</div>


<div class="tagline">

Brand × Product × AI

</div>


<div class="status">

COMING SOON

</div>



</div>



</body>


</html>
