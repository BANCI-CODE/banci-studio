<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANCI Studio</title>


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}



body{

    width:100%;
    height:100vh;

    background:#0b0b0b;

    color:#ffffff;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    font-family:

    Inter,
    Helvetica,
    Arial,
    sans-serif;

}



/* 背景光晕 */

body::before{

    content:"";

    position:absolute;

    width:900px;

    height:900px;

    background:

    radial-gradient(
    circle,
    rgba(255,255,255,0.06),
    transparent 65%
    );

    filter:blur(50px);

}



/* 主容器 */

.container{

    position:relative;

    text-align:center;

    animation:fadeIn 1.5s ease;

}



/* LOGO */


.logo{

    width:72px;

    height:72px;

    margin-bottom:35px;

    opacity:1;


    /* 黑色SVG转白色 */

    filter:

    brightness(0)
    invert(1);


    animation:

    float 4s infinite ease-in-out;

}



/* 品牌名称 */


h1{


    font-size:72px;

    font-weight:600;

    letter-spacing:18px;

    margin-left:18px;


    line-height:1;

}



/* 副标题 */


.subtitle{


    margin-top:38px;


    font-size:18px;


    letter-spacing:4px;


    color:#b5b5b5;


}



/* 品牌方向 */


.tag{


    margin-top:20px;


    font-size:16px;


    letter-spacing:5px;


    color:#777;


}



/* 状态 */


.enter{


    margin-top:55px;


    font-size:13px;


    letter-spacing:4px;


    color:#666;


}





/* 动画 */


@keyframes fadeIn{


    from{

        opacity:0;

        transform:translateY(30px);

    }


    to{

        opacity:1;

        transform:none;

    }


}



@keyframes float{


    0%,100%{

        transform:translateY(0);

    }


    50%{

        transform:translateY(-10px);

    }


}



/* 手机 */


@media(max-width:768px){



.logo{

    width:55px;

    height:55px;

    margin-bottom:28px;

}



h1{


    font-size:42px;

    letter-spacing:12px;

    margin-left:12px;


}



.subtitle{


    font-size:13px;

    letter-spacing:3px;


}



.tag{


    font-size:12px;

    letter-spacing:3px;


}



.enter{


    margin-top:40px;

}



}



</style>


</head>




<body>



<div class="container">



<img

src="./BANCI.svg"

alt="BANCI Logo"

class="logo"

>



<h1>

BANCI

</h1>



<div class="subtitle">

Design Thinking Studio

</div>



<div class="tag">

Brand × Product × AI

</div>



<div class="enter">

COMING SOON

</div>



</div>



</body>


</html>
