<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>BANCI Studio — Design Thinking Studio</title>


<!-- 网站图标 -->

<link rel="icon" 
type="image/svg+xml" 
href="./BANCI.svg">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;

}



html,
body{

width:100%;
height:100%;

}



body{

background:#050505;

color:#ffffff;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;


font-family:

"Arial Black",
"Helvetica Neue",
Arial,
sans-serif;

}




.container{


width:100%;

height:100vh;


display:flex;

flex-direction:column;

justify-content:center;

align-items:center;


text-align:center;


animation:fadeIn 1.5s ease;


}




/* ==================
   LOGO
================== */


.logo{


width:160px;

height:160px;


object-fit:contain;


margin-bottom:35px;



/* 黑色SVG自动转白 */

filter:brightness(0) invert(1);



}




/* ==================
   BANCI
================== */


.brand{


font-size:88px;


font-weight:900;


letter-spacing:14px;


line-height:1;


margin-left:14px;



}




/* ==================
   副标题
================== */


.subtitle{


margin-top:38px;


font-size:18px;


font-weight:400;


letter-spacing:6px;


color:#b8b8b8;



}




.tag{


margin-top:24px;


font-size:15px;


letter-spacing:6px;


color:#777;



}





.line{


width:45px;


height:1px;


background:#444;


margin:45px auto;



}




.contact{


font-size:14px;


letter-spacing:3px;


}



.contact a{


color:#aaa;


text-decoration:none;



}




/* ==================
   动画
================== */


@keyframes fadeIn{


from{


opacity:0;


transform:translateY(25px);



}


to{


opacity:1;


transform:translateY(0);



}


}




/* ==================
   手机
================== */


@media(max-width:768px){



.logo{


width:110px;


height:110px;



margin-bottom:28px;



}




.brand{


font-size:46px;


letter-spacing:9px;


margin-left:9px;



}




.subtitle{


font-size:13px;


letter-spacing:3px;



}




.tag{


font-size:12px;


letter-spacing:3px;



}




.contact{


font-size:12px;



}



}




</style>


</head>



<body>



<div class="container">



<!-- BANCI SVG LOGO -->


<img

src="./BANCI.svg"

alt="BANCI Logo"

class="logo"



>




<div class="brand">

BANCI

</div>




<div class="subtitle">

Design Thinking Studio

</div>




<div class="tag">

Brand × Product × AI

</div>




<div class="line"></div>




<div class="contact">


<a href="mailto:hello@banci.studio">

hello@banci.studio

</a>


</div>



</div>



</body>


</html>
