<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BANCI Studio — Design Thinking Studio</title>

<meta name="description" content="BANCI Studio | Brand × Product × AI">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#050505;
    color:#fff;
    font-family:
    Arial,
    Helvetica,
    sans-serif;
}


body{
    display:flex;
    justify-content:center;
    align-items:center;
}


/* 主容器 */

.container{

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

}



/* LOGO */

.logo{

    width:160px;
    height:160px;

    margin-bottom:40px;

}


.logo img{

    width:100%;
    height:100%;

    object-fit:contain;

}



/* 品牌名 */


.brand{

    font-size:72px;

    font-weight:800;

    letter-spacing:18px;

    margin-left:18px;

}



.subtitle{

    margin-top:24px;

    font-size:18px;

    letter-spacing:8px;

    color:#bdbdbd;

}



.tag{

    margin-top:22px;

    font-size:16px;

    letter-spacing:7px;

    color:#666;

}



.line{

    width:40px;

    height:1px;

    background:#444;

    margin:45px auto;

}



.contact{

    font-size:14px;

    letter-spacing:3px;

    color:#888;

}



.contact a{

    color:#fff;

    text-decoration:none;

}



/* 手机适配 */

@media(max-width:768px){


.logo{

    width:110px;

    height:110px;

    margin-bottom:30px;

}


.brand{

    font-size:42px;

    letter-spacing:10px;

}


.subtitle{

    font-size:13px;

    letter-spacing:4px;

}


.tag{

    font-size:12px;

    letter-spacing:3px;

}


.contact{

    font-size:12px;

}


}



</style>

</head>


<body>


<div class="container">


    <!-- 替换你的SVG LOGO -->

    <div class="logo">

        <img src="logo.svg" alt="BANCI Logo">

    </div>



    <div class="brand">
        BANCI
    </div>



    <div class="subtitle">
        Design Thinking Studio
    </div>



    <div class="tag">
        Brand × Product × AI
    </div>



    <div class="line"></div>



    <div class="contact">

        <a href="mailto:hello@banci.studio">
        hello@banci.studio
        </a>

    </div>


</div>


</body>

</html>
