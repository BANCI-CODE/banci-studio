<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>BANCI Studio</title>

<style>

*{
    box-sizing:border-box;
}

html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

}


body{

    background:#111;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}


.container{

    width:100%;

    max-width:1200px;

    text-align:center;

}


.logo{

    width:100px;

    height:auto;

    margin-bottom:40px;

}


h1{

    font-size:72px;

    letter-spacing:15px;

    margin:0 0 30px;

}


p{

    font-size:20px;

    opacity:.7;

    margin:12px;

}



@media(max-width:768px){

h1{

font-size:42px;

}

p{

font-size:16px;

}


.logo{

width:70px;

}


}


</style>


</head>


<body>


<div class="container">


<img src="./BANCI.svg" 
alt="BANCI Logo" 
class="logo">


<h1>BANCI</h1>


<p>Design Thinking Studio</p>


<p>Brand × Product × AI</p>


<p>Coming Soon</p>


</div>


</body>


</html>
