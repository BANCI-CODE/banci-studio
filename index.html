<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<!-- Favicon -->

<link rel="icon" 
type="image/svg+xml" 
href="./BANCI.svg">


<title>BANCI — Design Thinking Studio</title>


<style>


/* =========================
   Reset
========================= */


*{

margin:0;
padding:0;
box-sizing:border-box;

}



html,
body{

width:100%;
height:100%;

}



/* =========================
   Background
========================= */


body{

background:#090909;

color:#ffffff;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

font-family:

"Arial Black",
"Helvetica Neue",
Arial,
sans-serif;

}



/* =========================
   Container
========================= */


.container{

text-align:center;

animation:fadeIn 1.4s ease;

}



/* =========================
   Logo
========================= */


.logo{

width:160px;

height:160px;

object-fit:contain;

margin-bottom:30px;


/* 黑色Logo转白色 */

filter:brightness(0) invert(1);


}



/* =========================
   Brand Name
========================= */


h1{

font-family:

"Arial Black",
"Helvetica Neue",
Arial,
sans-serif;


font-size:96px;


font-weight:900;


letter-spacing:12px;


line-height:1;


color:#ffffff;


}



/* =========================
   Subtitle
========================= */


.subtitle{


margin-top:42px;


font-size:18px;


font-weight:400;


letter-spacing:5px;


color:#b5b5b5;


}



/* =========================
   Tagline
========================= */


.tagline{


margin-top:25px;


font-size:16px;


letter-spacing:5px;


color:#777;


}



/* =========================
   Status
========================= */


.status{


margin-top:60px;


font-size:12px;


letter-spacing:8px;


color:#555;


}




/* =========================
   Animation
========================= */


@keyframes fadeIn{


from{


opacity:0;

transform:translateY(25px);


}


to{


opacity:1;

transform:translateY(0);


}



}




/* =========================
   Mobile
========================= */


@media(max-width:768px){



.logo{


width:100px;

height:100px;

margin-bottom:25px;


}



h1{


font-size:52px;


letter-spacing:8px;


}



.subtitle{


margin-top:30px;


font-size:13px;


letter-spacing:3px;


}



.tagline{


font-size:12px;


letter-spacing:3px;


}



.status{


margin-top:45px;


font-size:10px;


letter-spacing:6px;


}



}



</style>


</head>



<body>



<div class="container">



<img

src="./BANCI.svg"

alt="BANCI Logo"

class="logo"



>



<h1>

BANCI

</h1>



<div class="subtitle">

Design Thinking Studio

</div>



<div class="tagline">

Brand × Product × AI

</div>



<div class="status">

COMING SOON

</div>



</div>



</body>


</html>
