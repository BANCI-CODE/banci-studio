<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<!-- Favicon -->
<link rel="icon" 
type="image/svg+xml" 
href="./BANCI.svg">


<!-- Website Title -->
<title>BANCI — Design Thinking Studio</title>


<style>


/* =========================
   Reset
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;
    height:100%;

}


/* =========================
   Body
========================= */


body{

    background:#0B0B0B;

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:

    "Helvetica Neue",
    Helvetica,
    Arial,
    sans-serif;

}


/* =========================
   Main Container
========================= */


.container{

    text-align:center;

    animation:fadeIn 1.5s ease;

}



/* =========================
   Logo
========================= */


.logo{

    width:90px;

    height:90px;

    margin-bottom:45px;

}



/* =========================
   Brand Name
========================= */


h1{


    font-size:72px;

    font-weight:500;

    letter-spacing:18px;

    margin-left:18px;

    line-height:1;


}



/* =========================
   Subtitle
========================= */


.subtitle{


    margin-top:45px;


    font-size:18px;

    letter-spacing:6px;

    color:#B5B5B5;


}



.tagline{


    margin-top:25px;


    font-size:16px;


    letter-spacing:5px;


    color:#777;


}



.status{


    margin-top:55px;


    font-size:13px;


    letter-spacing:8px;


    color:#555;


}



/* =========================
   Animation
========================= */


@keyframes fadeIn{


    from{

        opacity:0;

        transform:translateY(20px);

    }


    to{

        opacity:1;

        transform:translateY(0);

    }


}



/* =========================
   Mobile
========================= */


@media(max-width:768px){


.logo{

    width:70px;

    height:70px;

}



h1{


    font-size:42px;

    letter-spacing:12px;


}


.subtitle{

    font-size:14px;

}


.tagline{

    font-size:12px;

}



}


</style>


</head>



<body>



<div class="container">



    <!-- BANCI Logo -->

    <img 
    src="./BANCI.svg" 
    alt="BANCI Logo"
    class="logo">



    <!-- Brand -->

    <h1>
        BANCI
    </h1>



    <div class="subtitle">

        Design Thinking Studio

    </div>



    <div class="tagline">

        Brand × Product × AI

    </div>



    <div class="status">

        COMING SOON

    </div>



</div>



</body>


</html>
